# Builds the runtime and a playable build of the game from a fetched copy of the original.
#
# Nothing in this repository carries the game, so the workflow fetches one the way anybody
# would: from the Internet Archive, over the checksum tools/fetch-game.sh pins. The soundfont
# the music is rendered against is fetched the same way. Both downloads are cached, so they
# happen once and every run after starts from the copies already on disk.
#
# A push to main also publishes that build to GitHub Pages, which is the demo. Nothing about
# that changes what the repository holds: the game reaches the demo the same way it reaches a
# build on your own machine, by being fetched at build time.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deployment at a time, and a push that lands mid-deploy waits rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache the copy of the game and the soundfont
        uses: actions/cache@v4
        with:
          path: game
          # The checksums are in the scripts, so a change to what is fetched misses the cache.
          key: game-${{ hashFiles('tools/fetch-game.sh', 'tools/fetch-soundfont.sh') }}

      - name: Fetch the game
        run: ./tools/fetch-game.sh

      # The music is MIDI, and tools/unpack renders it against this before a build carries it.
      - name: Fetch the soundfont
        run: ./tools/fetch-soundfont.sh

      - name: Cache the unpacker's build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/unpack/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/unpack/Cargo.toml', 'tools/unpack/src/**') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the runtime's dependencies
        working-directory: web
        run: npm ci

      # Reads the game, builds the library, checks every opcode in the game's event tables
      # against the interpreter, and writes the page that puts the two together.
      - name: Build
        run: ./tools/package.sh game/gunner3.exe build

      - name: Build the single-file page
        run: ./tools/package.sh --single-file game/gunner3.exe build-single

      - uses: actions/upload-artifact@v4
        with:
          name: gunner3-web
          path: |
            build
            build-single/index.html
          retention-days: 14

      # The page loads its library and its package by relative path, so it works from the
      # subdirectory Pages serves a project site from without being told where it is.
      - name: Package the build for Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
